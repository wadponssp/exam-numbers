<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>หมายเลขแบบทดสอบ ม.6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: green header band, then a two-column workspace (subject finder | numbers for the chosen subject); stacks on phones. Tokens follow the SSP Green design system. */
:root {
  --band: #1e816c;
  --accent: #1e816c;
  --accent-hover: #16624f;
  --on-brand: #ffffff;
  --heading: #0f4a3c;
  --link: #16624f;
  --tint: #f0f8f5;
  --tint-strong: #ddf0e9;
  --focus-halo: #bfe3d7;
  --exam-date: #8b1a2b;
  --gold: #e2b007;
  --ink: #17302a;
  --muted: #566b65;
  --field-border: #7a938c;
  --line: #cfddd8;
  --surface: #f5f9f7;
  --card: #ffffff;
  --warn-ink: #6b4e00;
  --warn-bg: #fff6db;
  --match-bg: #fff1bf;
  --shadow-card: 0 1px 2px rgba(15, 74, 60, 0.06), 0 6px 20px rgba(15, 74, 60, 0.07);
  --paper: #ffffff;
  --scrim: rgba(8, 20, 16, 0.95);
  --on-scrim: #ffffff;

  --font: "Sarabun", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --control-h: 46px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --band: #14594a;
    --accent: #1e816c;
    --accent-hover: #26957d;
    --on-brand: #ffffff;
    --heading: #b5e6d5;
    --link: #8fd3bd;
    --tint: #162b25;
    --tint-strong: #1d3a32;
    --focus-halo: #2d5a4e;
    --exam-date: #f2a7b1;
    --gold: #e2b007;
    --ink: #e4efeb;
    --muted: #9db3ab;
    --field-border: #6f8a83;
    --line: #29403a;
    --surface: #0e1916;
    --card: #13221e;
    --warn-ink: #f2d98c;
    --warn-bg: #352b0c;
    --match-bg: #3d3412;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --band: #14594a;
  --accent: #1e816c;
  --accent-hover: #26957d;
  --on-brand: #ffffff;
  --heading: #b5e6d5;
  --link: #8fd3bd;
  --tint: #162b25;
  --tint-strong: #1d3a32;
  --focus-halo: #2d5a4e;
  --exam-date: #f2a7b1;
  --gold: #e2b007;
  --ink: #e4efeb;
  --muted: #9db3ab;
  --field-border: #6f8a83;
  --line: #29403a;
  --surface: #0e1916;
  --card: #13221e;
  --warn-ink: #f2d98c;
  --warn-bg: #352b0c;
  --match-bg: #3d3412;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.6;
}
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Header band */
.band {
  background: var(--band);
  color: var(--on-brand);
  border-bottom: 4px solid var(--gold);
}
.band-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding-block: 18px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 24px;
}
.band h1 { font-size: 24px; line-height: 1.25; font-weight: 700; }
.band p { margin: 0; font-size: 15px; opacity: 0.92; }

/* Workspace */
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
.card {
  background: var(--card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  min-width: 0;
}

/* Finder */
.finder {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
.finder-top {
  padding: 18px 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-bottom: 1px solid var(--line);
}
.label { font-size: 15px; font-weight: 600; color: var(--ink); }
.search {
  position: relative;
}
.search input {
  width: 100%;
  height: var(--control-h);
  border: 1px solid var(--field-border);
  border-radius: var(--radius-sm);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 17px;
  padding: 0 44px 0 14px;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--focus-halo); }
.search .clear {
  position: absolute;
  right: 4px;
  top: 4px;
  width: 38px;
  height: 38px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 22px;
  line-height: 1;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.search .clear:hover { background: var(--tint); color: var(--ink); }
.hint { font-size: 14px; color: var(--muted); margin: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filter {
  min-height: 38px;
  padding: 4px 14px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--field-border);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
}
.filter:hover { background: var(--tint); }
.filter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-brand); }

select#group {
  width: 100%;
  height: var(--control-h);
  border: 1px solid var(--field-border);
  border-radius: var(--radius-sm);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 16px;
  padding: 0 12px;
}

.result-line { font-size: 14px; color: var(--muted); margin: 0; }
.result-line strong { color: var(--ink); font-weight: 600; }

.list {
  overflow-y: auto;
  padding: 6px 18px 18px;
  overscroll-behavior: contain;
}
.day { padding-top: 12px; }
.day-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--exam-date);
  margin: 0 0 6px;
}
.slot { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.slot-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.02em;
  margin: 0;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  min-height: var(--control-h);
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--field-border);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 16px;
  line-height: 1.35;
  text-align: left;
  cursor: pointer;
  max-width: 100%;
}
.chip:hover { background: var(--tint); }
.chip .code { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-brand); }
.chip[aria-pressed="true"] .code { color: var(--on-brand); opacity: 0.85; }
.empty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  background: var(--tint);
  color: var(--ink);
  font-size: 15px;
}

/* Detail */
.detail { padding: 24px; display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 12px; }
.detail-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 12px 20px;
  align-items: flex-start;
}
.detail-head > div { min-width: 0; flex: 1 1 320px; }
.detail-head > .actions { flex: 0 0 auto; }
.eyebrow { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 2px; }
.eyebrow .code { color: var(--link); }
.detail h2 { font-size: 26px; line-height: 1.3; color: var(--heading); font-weight: 700; }
.when { margin: 6px 0 0; font-size: 16px; color: var(--ink); }
.when .date { color: var(--exam-date); font-weight: 600; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--control-h);
  padding: 8px 18px;
  border-radius: var(--radius-md);
  border: 1px solid var(--accent);
  background: var(--card);
  color: var(--link);
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: var(--tint); }
.copy-status { font-size: 14px; color: var(--link); margin: 6px 0 0; text-align: right; max-width: 260px; }
.copy-status:empty { display: none; }
.copy-fallback { width: 100%; min-height: 160px; font: inherit; font-size: 14px; border: 1px solid var(--field-border); border-radius: var(--radius-sm); background: var(--card); color: var(--ink); padding: 10px; }

.stats {
  display: grid;
  grid-template-columns: 1.6fr 1fr 1fr 1.4fr;
  gap: 10px;
}
.stat {
  background: var(--tint);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  min-width: 0;
}
.stat-label { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0; }
.stat-value { font-size: 22px; font-weight: 700; color: var(--heading); margin: 0; line-height: 1.35; }
.stat-value.big { font-size: 28px; }
.stat-value small { font-size: 15px; font-weight: 500; color: var(--muted); }
.stat-value.text { font-size: 17px; font-weight: 600; line-height: 1.45; }

.notice {
  padding: 12px 16px;
  border-radius: var(--radius-md);
  background: var(--warn-bg);
  color: var(--warn-ink);
  font-size: 15px;
  margin: 0;
}
.notice.info { background: var(--tint-strong); color: var(--heading); }

/* Room table */
.rooms { overflow-x: auto; }
.rooms-head, .room {
  display: grid;
  grid-template-columns: 150px minmax(0, 1fr) 150px;
  gap: 4px 16px;
  align-items: start;
}
.rooms-head {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  padding: 0 12px 8px;
  border-bottom: 2px solid var(--line);
}
.rooms-head .r { text-align: right; }
.room {
  padding: 12px;
  border-bottom: 1px solid var(--line);
}
.room-name { font-weight: 700; font-size: 17px; color: var(--ink); line-height: 1.35; }
.room-name small { display: block; font-size: 14px; font-weight: 500; color: var(--muted); }
.segs { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.seg {
  display: grid;
  grid-template-columns: 52px minmax(92px, 1fr) 62px 96px;
  gap: 8px;
  align-items: baseline;
  padding: 2px 8px;
  margin: 0 -8px;
  border-radius: var(--radius-sm);
}
.seg .cls { font-weight: 700; }
.seg .seats { color: var(--muted); font-size: 15px; }
.seg .cnt { color: var(--muted); font-size: 15px; text-align: right; }
.seg .rng { font-weight: 600; text-align: right; }
.seg.match { background: var(--match-bg); }
.envelope { text-align: right; }
.envelope b { display: block; font-size: 20px; color: var(--heading); line-height: 1.3; }
.envelope span { font-size: 14px; color: var(--muted); }
.room.has-match { background: var(--tint); }

.source { font-size: 14px; color: var(--muted); margin: 0; }

/* Print documents */
.print {
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.print-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
}
.print-head h3 { font-size: 18px; line-height: 1.4; color: var(--heading); }
.spare { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.spare-label { font-size: 15px; font-weight: 600; color: var(--ink); }
.docs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.doc {
  background: var(--tint);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.doc h4 { margin: 0; font-size: 17px; line-height: 1.4; color: var(--ink); }
.doc p { margin: 0; font-size: 14px; color: var(--muted); }
.thumbs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
  min-height: 112px;
  align-items: flex-start;
}
.thumb {
  flex: 0 0 auto;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--paper);
  cursor: zoom-in;
  line-height: 0;
}
.thumb img { display: block; height: 104px; width: auto; border-radius: 3px; }
.thumb-wait { font-size: 14px; color: var(--muted); align-self: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-brand); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn:disabled { opacity: 0.6; cursor: progress; }
.print-status { margin: 0; font-size: 15px; color: var(--link); }
.print-status:empty { display: none; }

.viewer {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--scrim);
  display: flex;
  flex-direction: column;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  gap: 10px;
}
.viewer[hidden] { display: none; }
.viewer-bar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px 12px;
  color: var(--on-scrim);
  max-width: 1000px;
  width: 100%;
  margin: 0 auto;
}
.viewer-head { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.viewer-head b { font-size: 16px; line-height: 1.45; }
.viewer-hint { font-size: 14px; line-height: 1.5; opacity: 0.9; }
.viewer-actions { display: flex; flex: 0 0 auto; gap: 8px; }
.viewer-actions .btn { min-height: 40px; padding: 6px 16px; }
.print-sheets { display: none; }
@media print {
  @page { size: A4 portrait; margin: 0; }
  html.print-sheets-on, html.print-sheets-on body { margin: 0 !important; padding: 0 !important; background: #ffffff !important; }
  html.print-sheets-on body > *:not(.print-sheets) { display: none !important; }
  html.print-sheets-on .print-sheets { display: block !important; }
  .print-sheets img { display: block; width: 99.6%; height: auto; margin: 0 auto; }
  .print-sheets img + img { break-before: page; page-break-before: always; }
}
.viewer-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding-block: 4px 16px;
}
.sheet { margin: 0; width: min(100%, 640px); display: flex; flex-direction: column; gap: 6px; }
.sheet.land { width: min(100%, 1000px); }
.sheet img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 210 / 297;
  background: var(--paper);
  border-radius: 4px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
}
.sheet.land img { aspect-ratio: 297 / 210; }
.sheet figcaption { color: var(--on-scrim); font-size: 14px; text-align: center; opacity: 0.9; }
.doc-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.doc-actions .btn { flex: 1 1 150px; }

/* Phones and narrow windows */
@media (max-width: 900px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .finder { position: static; max-height: none; }
  .list { overflow: visible; }
}
@media (max-width: 640px) {
  .detail { padding: 18px 16px; }
  .detail h2 { font-size: 22px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat.wide { grid-column: 1 / -1; }
  .rooms-head { display: none; }
  .room { grid-template-columns: minmax(0, 1fr) auto; padding: 12px 4px; }
  .room .segs { grid-column: 1 / -1; grid-row: 2; }
  .seg { grid-template-columns: 46px minmax(0, 1fr) 46px 84px; gap: 6px; }
  .docs { grid-template-columns: minmax(0, 1fr); }
  .print { padding: 14px 12px; }
  .copy-status { text-align: left; }
}
@media (prefers-reduced-motion: no-preference) {
  .chip, .filter, .btn { transition: background-color 120ms ease, color 120ms ease; }
}
</style>

</head>
<body>
<header class="band">
  <div class="band-inner">
    <h1>หมายเลขแบบทดสอบ ม.6</h1>
    <p>สอบกลางภาค ภาคเรียนที่ 2/2569 · 9, 11 และ 13 พฤศจิกายน 2569</p>
  </div>
</header>

<main class="wrap">
  <aside class="card finder" aria-label="ค้นหาวิชา">
    <div class="finder-top">
      <label class="label" for="q">ค้นหาวิชา</label>
      <div class="search">
        <input id="q" type="search" autocomplete="off" enterkeyhint="search"
               placeholder="ชื่อวิชา รหัสวิชา ห้องเรียน หรือห้องสอบ">
        <button class="clear" id="clear" type="button" aria-label="ล้างคำค้นหา" hidden>×</button>
      </div>
      <p class="hint">เช่น ภาษาไทย, ค33102, 6/10 หรือ 3507</p>
      <div class="filters" id="days" role="group" aria-label="วันสอบ"></div>
      <label class="label" for="group">กลุ่มสาระการเรียนรู้</label>
      <select id="group"></select>
      <p class="result-line" id="resultLine" aria-live="polite"></p>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <section class="card detail" id="detail" aria-live="polite" tabindex="-1"></section>
</main>

<script>
(function () {
  "use strict";

  // ผังห้องสอบ: [ห้องสอบที่, หมายเลขห้องสอบ, ระดับ/ห้อง, เลขที่เริ่ม, เลขที่สิ้นสุด, จำนวน]
  var SEGMENTS = [
    [1, "3601", "6/1", 1, 35, 35],
    [2, "3602", "6/2", 1, 28, 28],
    [3, "3606", "6/3", 1, 33, 33],
    [4, "3607", "6/3", 34, 39, 6],
    [4, "3607", "6/4", 1, 27, 27],
    [5, "3608", "6/4", 28, 39, 12],
    [5, "3608", "6/5", 1, 21, 21],
    [6, "3609", "6/5", 22, 39, 18],
    [6, "3609", "6/6", 1, 15, 15],
    [7, "3610", "6/6", 16, 38, 23],
    [7, "3610", "6/7", 1, 10, 10],
    [8, "3510", "6/7", 11, 39, 29],
    [8, "3510", "6/9", 1, 5, 5],
    [9, "3509", "6/9", 6, 39, 34],
    [10, "3508", "6/8", 1, 30, 30],
    [11, "3507", "6/8", 31, 36, 6],
    [11, "3507", "6/10", 1, 24, 24],
    [12, "3506", "6/10", 25, 37, 13],
    [12, "3506", "6/11", 1, 17, 17],
    [13, "3505", "6/11", 18, 39, 22],
    [13, "3505", "6/12", 1, 8, 8],
    [14, "3503", "6/12", 9, 37, 29],
    [15, "3502", "6/13", 1, 28, 28]
  ].map(function (s, i) {
    return { idx: i, room: s[0], roomNo: s[1], cls: s[2], from: s[3], to: s[4], count: s[5] };

  function pad3(n) { return String(n).padStart(3, "0"); }

  // หมายเลขเรียงต่อเนื่องในแต่ละวิชา ตามลำดับห้องสอบ 1–15 และเลขที่นักเรียน
  function build(s) {
    var segs = SEGMENTS.filter(function (seg) {
      if (s.classes === ALL) return true;
      var n = Number(seg.cls.split("/")[1]);
      return s.classes.indexOf(n) !== -1;
    });
    var cum = 0, rooms = [];
    segs.forEach(function (seg) {
      var start = cum + 1, end = cum + seg.count;
      cum = end;
      var last = rooms[rooms.length - 1];
      var row = { seg: seg, start: start, end: end };
      if (last && last.room === seg.room) {
        last.rows.push(row);
        last.end = end;
        last.total += seg.count;
      } else {
        rooms.push({ room: seg.room, roomNo: seg.roomNo, rows: [row], start: start, end: end, total: seg.count });
      }
    });
    s.rooms = rooms;
    s.total = cum;
    s.search = norm([s.code, s.name, G[s.group]].join(" "));
    return s;
  }

  function norm(t) {
    return String(t).toLowerCase().replace(/[\s.\-–_]/g, "");
  }

  // Parse a query that names a class ("6/10", "ม.6/10") or an exam room ("3507")
  function parseTarget(q) {
    var t = q.trim().replace(/\s+/g, "");
    var m = t.match(/^(?:ม\.?)?6\/(\d{1,2})$/);
    if (m) return { kind: "class", value: "6/" + Number(m[1]) };
    m = t.match(/^(3[56]\d\d)$/);
    if (m) return { kind: "room", value: m[1] };
    return null;
  }

  function segMatches(seg, target) {
    if (!target) return false;
    return target.kind === "class" ? seg.cls === target.value : seg.roomNo === target.value;
  }

    return String(t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];

  }

  function filtered() {
    var target = parseTarget(state.q);

      if (state.group && s.group !== state.group) return false;

  // One bag per exam room in room order, then the spare bags.
  function bagsFor(s, spares) {

  function Painter(ctx, k) { this.ctx = ctx; this.k = k; this.ratio = {}; }

  // font size (px) whose digit height is `mm`
  Painter.prototype.cap = function (w, mm) {
    if (!this.ratio[w]) {
      this.font(w, 100);

    }
    return mm * this.k / this.ratio[w];

  };

  // Covers go into the PDF turned onto A4 portrait, as in the sample; previews stay landscape.
  function paint(canvas, k, s, pg, forPdf) {
    var cover = pg.kind === "cover", turned = cover && forPdf;
    var landscape = cover && !forPdf;
    canvas.width = Math.round((landscape ? 297 : 210) * k);
    canvas.height = Math.round((landscape ? 210 : 297) * k);
    var ctx = canvas.getContext("2d");
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#000000";
    if (turned) { ctx.translate(0, canvas.height); ctx.rotate(-Math.PI / 2); }
    if (cover) drawCover(ctx, k, s, pg.bag); else drawSlip(ctx, k, s, pg.slip);
  }

  function canvasJpeg(canvas) {
    return new Promise(function (resolve, reject) {
      canvas.toBlob(function (b) {

        b.arrayBuffer().then(function (ab) { resolve(new Uint8Array(ab)); }, reject);
      }, "image/jpeg", 0.86);
    });
  }

  // Minimal PDF 1.4 writer: one full-page JPEG per A4 page.
  function buildPdf(images, title) {
    var enc = new TextEncoder(), parts = [], pos = 0, offs = [];
    function put(x) { var b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); pos += b.length; }
    function begin(n) { offs[n] = pos; put(n + " 0 obj\n"); }
    var W = "595.28", H = "841.89", n = images.length;
    put(new Uint8Array([37, 80, 68, 70, 45, 49, 46, 52, 10, 37, 226, 227, 207, 211, 10]));
    begin(1); put("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
    begin(2); put("<< /Type /Pages /Count " + n + " /Kids [" + images.map(function (_, i) { return (4 + i * 3) + " 0 R"; }).join(" ") + "] >>\nendobj\n");
    var hex = "FEFF";
    for (var c = 0; c < title.length; c++) hex += ("000" + title.charCodeAt(c).toString(16)).slice(-4).toUpperCase();
    begin(3); put("<< /Title <" + hex + "> >>\nendobj\n");
    images.forEach(function (img, i) {
      var pg = 4 + i * 3, cs = "q " + W + " 0 0 " + H + " 0 0 cm /Im0 Do Q";
      begin(pg);
      put("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + W + " " + H + "] /Resources << /XObject << /Im0 " + (pg + 2) + " 0 R >> >> /Contents " + (pg + 1) + " 0 R >>\nendobj\n");
      begin(pg + 1);
      put("<< /Length " + cs.length + " >>\nstream\n" + cs + "\nendstream\nendobj\n");
      begin(pg + 2);
      put("<< /Type /XObject /Subtype /Image /Width " + img.w + " /Height " + img.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + img.bytes.length + " >>\nstream\n");
      put(img.bytes);
      put("\nendstream\nendobj\n");
    });
    var size = 4 + n * 3, xref = pos, x = "xref\n0 " + size + "\n0000000000 65535 f \n";
    for (var o = 1; o < size; o++) x += ("000000000" + offs[o]).slice(-10) + " 00000 n \n";
    put(x + "trailer\n<< /Size " + size + " /Root 1 0 R /Info 3 0 R >>\nstartxref\n" + xref + "\n%%EOF\n");
    return new Blob(parts, { type: "application/pdf" });
  }

  function fileTitle(s, kind) { return KINDS[kind].title + " - " + s.code + " " + s.name; }

  function makePdf(s, kind, spares, onProgress) {

      if (onProgress) onProgress(i + 1, pages.length);
      return canvasJpeg(canvas).then(function (bytes) {
        out.push({ bytes: bytes, w: canvas.width, h: canvas.height });
        i++;
        return new Promise(function (r) { setTimeout(r, 0); }).then(next);
      });
    }
    return fontsReady.then(next);
  }

  // Inside claude.ai the viewer hands files over through the downloads capability.
  // Opened as an ordinary web page, the browser's own download is used instead.
  var EMBEDDED = !!(window.claude && typeof window.claude.use === "function");
  var browserDownloads = {
    save: function (req) {
      var url = URL.createObjectURL(req.data);
      var a = document.createElement("a");
      a.href = url;
      a.download = req.filename;
      document.body.appendChild(a);
      a.click();

      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);

    : Promise.resolve(browserDownloads);

  var CAN_PRINT = !EMBEDDED && typeof window.print === "function";
  var downloadsReady = null;
  downloadsP.then(function (dl) {

    if (!dl) renderDetail();

  function downloadError(err) {
    var code = err && err.code;
    if (code === "declined") return "ยกเลิกการบันทึกไฟล์แล้ว";
    if (code === "rate_limited") return "มีหน้าต่างบันทึกไฟล์เปิดค้างอยู่ กรุณาปิดแล้วกดดาวน์โหลดอีกครั้ง";
    if (code === "too_large") return "ไฟล์ใหญ่เกินกว่าที่บันทึกได้ในหน้านี้";
    return NO_DOWNLOAD;

  function downloadPdf(s, kind, btn) {
    if (print.busy) return;
    print.busy = true;
    btn.disabled = true;
    var key = s.id + "|" + kind + "|" + print.spares, name = fileTitle(s, kind) + ".pdf";
    downloadsP.then(function (dl) {
      if (!dl) throw { code: "unavailable" };
      var blobP = print.last && print.last.key === key
        ? Promise.resolve(print.last.blob)
        : makePdf(s, kind, print.spares, function (i, n) { setPrintStatus("กำลังสร้าง PDF หน้า " + i + " จาก " + n + "…"); })
            .then(function (blob) { print.last = { key: key, blob: blob }; return blob; });
      return blobP.then(function (blob) {
        setPrintStatus("กรุณายืนยันการบันทึกไฟล์ " + name);
        return dl.save({ filename: name, data: blob });
      });
    }).then(function () {
      setPrintStatus("บันทึกไฟล์ " + name + " แล้ว");
    }, function (err) {
      setPrintStatus(downloadError(err));
    }).then(function () {
      print.busy = false;
      var b = el.detail.querySelector('[data-pdf="' + kind + '"]');
      if (b) b.disabled = false;
    });
  }

      ? "ตรวจดูทุกหน้า แล้วกด “พิมพ์” · ในหน้าต่างพิมพ์ เลือกกระดาษ A4 และปิดหัวกระดาษและท้ายกระดาษ ถ้ามีตัวเลือก"
      : "คอมพิวเตอร์: คลิกขวาที่ภาพ แล้วเลือก “บันทึกรูปภาพ” หรือ “คัดลอกรูปภาพ” · มือถือ: กดค้างที่ภาพ แล้วเลือก “บันทึกรูปภาพ” แล้วพิมพ์จากแอปรูปภาพลงกระดาษ A4") +
    "</span></div>" +
    '<div class="viewer-actions">' +
    (CAN_PRINT ? '<button type="button" class="btn primary" id="viewerPrint">พิมพ์</button>' : "") +
    '<button type="button" class="btn" id="viewerClose">ปิด</button></div></div>' +
    '<div class="viewer-body" id="viewerBody"></div>';
  document.body.appendChild(viewer);
  var view = { token: 0, back: null, key: null, urls: [], s: null, kind: null };

  // Print layer: A4 portrait page images (covers turned, as in the PDF), shown only while printing.
  var sheets = document.createElement("div");
  sheets.className = "print-sheets";
  sheets.setAttribute("aria-hidden", "true");
  document.body.appendChild(sheets);
  var printing = false;

  function printDoc() {
    if (printing || !view.s) return;
    printing = true;
    var btn = document.getElementById("viewerPrint");
    btn.disabled = true;
    var s = view.s, pages = pagesFor(s, view.kind, print.spares), canvas = document.createElement("canvas"), imgs = [], i = 0;
    function done() {
      printing = false;
      btn.disabled = false;
      btn.textContent = "พิมพ์";
    }
    function step() {
      if (i < pages.length) {
        btn.textContent = "กำลังเตรียม " + (i + 1) + "/" + pages.length;
        paint(canvas, PRINT_IMG_K, s, pages[i], true);
        var img = new Image();
        img.alt = "";
        img.src = canvas.toDataURL("image/jpeg", 0.9);
        imgs.push(img);
        i++;
        setTimeout(step, 0);
        return;
      }
      sheets.innerHTML = "";
      imgs.forEach(function (img) { sheets.appendChild(img); });
      Promise.all(imgs.map(function (img) { return img.decode ? img.decode().catch(function () {}) : null; })).then(function () {
        document.documentElement.classList.add("print-sheets-on");
        done();
        window.print();
      }, done);
    }
    fontsReady.then(function () { setTimeout(step, 0); });
  }
  window.addEventListener("afterprint", function () {
    document.documentElement.classList.remove("print-sheets-on");
    sheets.innerHTML = "";
  });
  if (CAN_PRINT) document.getElementById("viewerPrint").addEventListener("click", printDoc);

  function pageNote(pg) {
    if (pg.kind === "slip") return "ใบนำส่งกองกลาง (" + pg.slip.no + ")";
    return pg.bag.spare ? "กระเป๋าที่ " + pg.bag.seq + " · สำรอง" : "กระเป๋าที่ " + pg.bag.seq + " · ห้องสอบ " + pg.bag.room + " (" + pg.bag.roomNo + ")";
  }

  function showImages(s, kind, start) {
    var pages = pagesFor(s, kind, print.spares), key = s.id + "|" + kind + "|" + print.spares, token = ++view.token;
    view.s = s;
    view.kind = kind;
    if (view.key !== key) { view.key = key; view.urls = []; }
    view.back = document.activeElement;
    document.getElementById("viewerTitle").textContent = KINDS[kind].title + " · " + s.code + " " + s.name + " · " + pages.length + " หน้า";
    var body = document.getElementById("viewerBody");
    body.innerHTML = pages.map(function (pg, i) {
      return '<figure class="sheet' + (pg.kind === "cover" ? " land" : "") + '">' +
        '<img alt="' + esc(KINDS[kind].title + " หน้า " + (i + 1)) + '">' +
        "<figcaption>หน้า " + (i + 1) + " จาก " + pages.length + " · " + esc(pageNote(pg)) + "</figcaption></figure>";
    }).join("");
    viewer.hidden = false;
    document.getElementById("viewerClose").focus();
    var figs = body.querySelectorAll(".sheet");
    body.scrollTop = 0;
    if (start && figs[start]) figs[start].scrollIntoView({ block: "start" });
    var order = [], i;
    for (i = start; i < pages.length; i++) order.push(i);
    for (i = 0; i < start; i++) order.push(i);
    var canvas = document.createElement("canvas");
    function step() {
      if (token !== view.token || viewer.hidden || !order.length) return;
      var n = order.shift();
      if (!view.urls[n]) {
        paint(canvas, PRINT_IMG_K, s, pages[n], false);
        view.urls[n] = canvas.toDataURL("image/jpeg", 0.9);
      }
      figs[n].querySelector("img").src = view.urls[n];
      setTimeout(step, 0);
    }
    fontsReady.then(step);
  }
  function closeViewer() {
    view.token++;
    viewer.hidden = true;
    if (view.back && view.back.focus) view.back.focus();
  }
  document.getElementById("viewerClose").addEventListener("click", closeViewer);
  viewer.addEventListener("click", function (e) { if (e.target === viewer || e.target.id === "viewerBody") closeViewer(); });
  document.addEventListener("keydown", function (e) {
    if (!viewer.hidden && e.key === "Escape") closeViewer();
  });

  function currentSubject() {
    return SUBJECTS.find(function (x) { return x.id === state.selected; }) || SUBJECTS[0];
  }

  function subjectText(s) {
    var d = DAYS[s.day];
    var lines = [
      s.code + " " + s.name,
      d.full + " เวลา " + s.time + " น.",
      "หมายเลขแบบทดสอบ " + range(1, s.total) + " (" + s.total + " ชุด, " + s.rooms.length + " ห้องสอบ)",
      ""
    ];
    s.rooms.forEach(function (r) {
      var parts = r.rows.map(function (row) {
        return row.seg.cls + " เลขที่ " + row.seg.from + "–" + row.seg.to + (r.rows.length > 1 ? " (" + range(row.start, row.end) + ")" : "");
      });
      lines.push("ห้องสอบ " + r.room + " (" + r.roomNo + "): " + range(r.start, r.end) + " · " + r.total + " ชุด · " + parts.join(", "));
    });
    return lines.join("\n");
  }

  function copySubject(s) {
    var text = subjectText(s);
    var status = document.getElementById("copyStatus");
    function fallback() {
      status.textContent = "คัดลอกอัตโนมัติไม่ได้ กรุณาคัดลอกจากกล่องด้านล่าง";
      var ta = el.detail.querySelector(".copy-fallback");
      if (!ta) {
        ta = document.createElement("textarea");
        ta.className = "copy-fallback";
        ta.id = "copyText";
        ta.readOnly = true;
        el.detail.querySelector(".stats").before(ta);
      }
      ta.value = text;
      ta.focus();
      ta.select();
    }
    try {
      navigator.clipboard.writeText(text).then(function () {
        status.textContent = "คัดลอกแล้ว วางในแชตหรือเอกสารได้เลย";
      }, fallback);
    } catch (e) { fallback(); }
  }

  // ---------- events ----------
  function select(id, scroll) {
    if (!SUBJECTS.some(function (s) { return s.id === id; })) return;
    state.selected = id;
    if (location.hash !== "#" + id) {
      try { history.replaceState(null, "", "#" + id); } catch (e) { location.hash = id; }
    }
    renderList();
    renderDetail();
    if (scroll && window.matchMedia("(max-width: 900px)").matches) {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      el.detail.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    }
  }

  function onFilterChange() {
    el.clear.hidden = !state.q;
    var items = filtered();
    if (items.length === 1 && items[0].id !== state.selected) {
      state.selected = items[0].id;
      try { history.replaceState(null, "", "#" + state.selected); } catch (e) {}
    }
    renderList();
    renderDetail();
  }

  el.q.addEventListener("input", function () {
    state.q = el.q.value;
    onFilterChange();
  });
  el.q.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      var items = filtered();
      if (items.length) select(items[0].id, true);
    } else if (e.key === "Escape" && el.q.value) {
      el.q.value = "";
      state.q = "";
      onFilterChange();
    }
  });
  el.clear.addEventListener("click", function () {
    el.q.value = "";
    state.q = "";
    onFilterChange();
    el.q.focus();
  });
  el.days.addEventListener("click", function (e) {
    var b = e.target.closest("[data-day]");
    if (!b) return;
    state.day = Number(b.getAttribute("data-day"));
    renderDayChips();
    onFilterChange();
  });
  el.group.addEventListener("change", function () {
    state.group = el.group.value;
    onFilterChange();
  });
  el.list.addEventListener("click", function (e) {
    var b = e.target.closest("[data-id]");
    if (b) select(b.getAttribute("data-id"), true);
  });
  el.detail.addEventListener("click", function (e) {
    var t = e.target.closest("[data-pdf], [data-spares], [data-thumb], [data-images]");
    if (!t) return;
    var s = currentSubject();
    if (t.hasAttribute("data-spares")) {
      print.spares = Number(t.getAttribute("data-spares"));
      try { localStorage.setItem("examSpareBags", String(print.spares)); } catch (err) {}
      renderDetail();
      var again = el.detail.querySelector('[data-spares="' + print.spares + '"]');
      if (again) again.focus();
    } else if (t.hasAttribute("data-pdf")) {
      downloadPdf(s, t.getAttribute("data-pdf"), t);
    } else if (t.hasAttribute("data-images")) {
      showImages(s, t.getAttribute("data-images"), 0);
    } else {
      showImages(s, t.getAttribute("data-thumb"), Number(t.getAttribute("data-page")));
    }
  });
  window.addEventListener("hashchange", function () {
    var id = location.hash.slice(1);
    if (id && id !== state.selected) select(id, false);
  });

  // ---------- start ----------
  var initial = location.hash.slice(1);
  if (SUBJECTS.some(function (s) { return s.id === initial; })) state.selected = initial;
  renderDayChips();
  renderGroupSelect();
  renderList();
  renderDetail();

  window.__EXAM_DATA__ = { SUBJECTS: SUBJECTS, subjectText: subjectText, makePdf: makePdf, pagesFor: pagesFor, paint: paint };
})();
</script>

</body>
</html>
