<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>หมายเลขแบบทดสอบ ม.6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: green header band, then a two-column workspace (subject finder | numbers for the chosen subject); stacks on phones. Tokens follow the SSP Green design system. */
:root {
  --band: #1e816c;
  --accent: #1e816c;
  --accent-hover: #16624f;
  --on-brand: #ffffff;
  --heading: #0f4a3c;
  --link: #16624f;
  --tint: #f0f8f5;
  --tint-strong: #ddf0e9;
  --focus-halo: #bfe3d7;
  --exam-date: #8b1a2b;
  --gold: #e2b007;
  --ink: #17302a;
  --muted: #566b65;
  --field-border: #7a938c;
  --line: #cfddd8;
  --surface: #f5f9f7;
  --card: #ffffff;
  --warn-ink: #6b4e00;
  --warn-bg: #fff6db;
  --match-bg: #fff1bf;
  --shadow-card: 0 1px 2px rgba(15, 74, 60, 0.06), 0 6px 20px rgba(15, 74, 60, 0.07);
  --paper: #ffffff;
  --scrim: rgba(8, 20, 16, 0.95);
  --on-scrim: #ffffff;
  --on-brand-line: rgba(255, 255, 255, 0.55);
  --on-brand-hover: rgba(255, 255, 255, 0.14);

  --font: "Sarabun", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --control-h: 46px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --band: #14594a;
    --accent: #1e816c;
    --accent-hover: #26957d;
    --on-brand: #ffffff;
    --heading: #b5e6d5;
    --link: #8fd3bd;
    --tint: #162b25;
    --tint-strong: #1d3a32;
    --focus-halo: #2d5a4e;
    --exam-date: #f2a7b1;
    --gold: #e2b007;
    --ink: #e4efeb;
    --muted: #9db3ab;
    --field-border: #6f8a83;
    --line: #29403a;
    --surface: #0e1916;
    --card: #13221e;
    --warn-ink: #f2d98c;
    --warn-bg: #352b0c;
    --match-bg: #3d3412;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --band: #14594a;
  --accent: #1e816c;
  --accent-hover: #26957d;
  --on-brand: #ffffff;
  --heading: #b5e6d5;
  --link: #8fd3bd;
  --tint: #162b25;
  --tint-strong: #1d3a32;
  --focus-halo: #2d5a4e;
  --exam-date: #f2a7b1;
  --gold: #e2b007;
  --ink: #e4efeb;
  --muted: #9db3ab;
  --field-border: #6f8a83;
  --line: #29403a;
  --surface: #0e1916;
  --card: #13221e;
  --warn-ink: #f2d98c;
  --warn-bg: #352b0c;
  --match-bg: #3d3412;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.6;
}
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Header band */
.band {
  background: var(--band);
  color: var(--on-brand);
  border-bottom: 4px solid var(--gold);
}
.band-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding-block: 18px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 24px;
}
.band h1 { font-size: 24px; line-height: 1.25; font-weight: 700; }
.band p { margin: 0; font-size: 15px; opacity: 0.92; }
.band-inner:first-child { padding-bottom: 12px; }
.band-inner.tabs { padding-block: 0 14px; justify-content: flex-start; align-items: center; gap: 8px; }
.tab {
  color: var(--on-brand);
  text-decoration: none;
  font-size: 15px;
  font-weight: 600;
  padding: 6px 16px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--on-brand-line);
}
.tab:hover { background: var(--on-brand-hover); }
.tab[aria-current="page"] { background: var(--on-brand); color: var(--band); border-color: var(--on-brand); }

/* วผ.7 */
.src { display: flex; flex-direction: column; gap: 8px; }
.src-line { margin: 0; font-size: 15px; }
.src-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.small { min-height: 38px; padding: 4px 14px; font-size: 14px; }
.paste { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--radius-md); background: var(--tint); }
.paste textarea, .field input, .abs-row input[type="text"] {
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--field-border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
}
.paste textarea { width: 100%; resize: vertical; }
.paste input[type="file"] { font: inherit; font-size: 14px; max-width: 100%; }
.stu {
  display: grid;
  grid-template-columns: auto 2.2em minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  min-height: 44px;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 16px;
}
.stu:hover { background: var(--tint); }
.stu.on { background: var(--tint-strong); }
.stu input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
.stu .no, .stu .sid { color: var(--muted); font-size: 14px; }
.stu .no { text-align: right; }
.cls-tag { font-size: 13px; color: var(--muted); margin-left: 4px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field input { min-height: 44px; }
.abs-list { display: flex; flex-direction: column; gap: 12px; }
.abs {
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.abs-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.abs-head b { display: block; font-size: 17px; }
.abs-head span { font-size: 14px; color: var(--muted); }
.abs-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; font-size: 15px; }
.abs-row .reason { display: inline-flex; align-items: center; gap: 8px; }
.abs-row input[type="text"] { width: 12em; min-height: 40px; }
.tick { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.tick input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.abs-day { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; align-items: start; }
.day-label { font-size: 15px; font-weight: 600; color: var(--exam-date); padding-top: 6px; }
.filter.sub { font-size: 14px; min-height: 36px; text-align: left; }
.filter.sub b { font-weight: 700; }
.warn { font-size: 14px; color: var(--warn-ink); background: var(--warn-bg); border-radius: var(--radius-sm); padding: 4px 10px; }
.wp-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.wp-sum { margin: 0; font-size: 16px; }
.wp-actions .doc-actions .btn { flex: 0 1 auto; }

/* Workspace */
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
.card {
  background: var(--card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  min-width: 0;
}

/* Finder */
.finder {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
.finder-top {
  padding: 18px 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-bottom: 1px solid var(--line);
}
.label { font-size: 15px; font-weight: 600; color: var(--ink); }
.search {
  position: relative;
}
.search input {
  width: 100%;
  height: var(--control-h);
  border: 1px solid var(--field-border);
  border-radius: var(--radius-sm);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 17px;
  padding: 0 44px 0 14px;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--focus-halo); }
.search .clear {
  position: absolute;
  right: 4px;
  top: 4px;
  width: 38px;
  height: 38px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 22px;
  line-height: 1;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.search .clear:hover { background: var(--tint); color: var(--ink); }
.hint { font-size: 14px; color: var(--muted); margin: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filter {
  min-height: 38px;
  padding: 4px 14px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--field-border);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
}
.filter:hover { background: var(--tint); }
.filter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-brand); }

select#group {
  width: 100%;
  height: var(--control-h);
  border: 1px solid var(--field-border);
  border-radius: var(--radius-sm);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 16px;
  padding: 0 12px;
}

.result-line { font-size: 14px; color: var(--muted); margin: 0; }
.result-line strong { color: var(--ink); font-weight: 600; }

.list {
  overflow-y: auto;
  padding: 6px 18px 18px;
  overscroll-behavior: contain;
}
.day { padding-top: 12px; }
.day-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--exam-date);
  margin: 0 0 6px;
}
.slot { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.slot-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.02em;
  margin: 0;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  min-height: var(--control-h);
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--field-border);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 16px;
  line-height: 1.35;
  text-align: left;
  cursor: pointer;
  max-width: 100%;
}
.chip:hover { background: var(--tint); }
.chip .code { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-brand); }
.chip[aria-pressed="true"] .code { color: var(--on-brand); opacity: 0.85; }
.empty {
  margin: 18px 0 0;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  background: var(--tint);
  color: var(--ink);
  font-size: 15px;
}

/* Detail */
.detail { padding: 24px; display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 12px; }
.detail-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 12px 20px;
  align-items: flex-start;
}
.detail-head > div { min-width: 0; flex: 1 1 320px; }
.detail-head > .actions { flex: 0 0 auto; }
.eyebrow { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 2px; }
.eyebrow .code { color: var(--link); }
.detail h2 { font-size: 26px; line-height: 1.3; color: var(--heading); font-weight: 700; }
.when { margin: 6px 0 0; font-size: 16px; color: var(--ink); }
.when .date { color: var(--exam-date); font-weight: 600; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--control-h);
  padding: 8px 18px;
  border-radius: var(--radius-md);
  border: 1px solid var(--accent);
  background: var(--card);
  color: var(--link);
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: var(--tint); }
.copy-status { font-size: 14px; color: var(--link); margin: 6px 0 0; text-align: right; max-width: 260px; }
.copy-status:empty { display: none; }
.copy-fallback { width: 100%; min-height: 160px; font: inherit; font-size: 14px; border: 1px solid var(--field-border); border-radius: var(--radius-sm); background: var(--card); color: var(--ink); padding: 10px; }

.stats {
  display: grid;
  grid-template-columns: 1.6fr 1fr 1fr 1.4fr;
  gap: 10px;
}
.stat {
  background: var(--tint);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  min-width: 0;
}
.stat-label { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0; }
.stat-value { font-size: 22px; font-weight: 700; color: var(--heading); margin: 0; line-height: 1.35; }
.stat-value.big { font-size: 28px; }
.stat-value small { font-size: 15px; font-weight: 500; color: var(--muted); }
.stat-value.text { font-size: 17px; font-weight: 600; line-height: 1.45; }

.notice {
  padding: 12px 16px;
  border-radius: var(--radius-md);
  background: var(--warn-bg);
  color: var(--warn-ink);
  font-size: 15px;
  margin: 0;
}
.notice.info { background: var(--tint-strong); color: var(--heading); }

/* Room table */
.rooms { overflow-x: auto; }
.rooms-head, .room {
  display: grid;
  grid-template-columns: 150px minmax(0, 1fr) 150px;
  gap: 4px 16px;
  align-items: start;
}
.rooms-head {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  padding: 0 12px 8px;
  border-bottom: 2px solid var(--line);
}
.rooms-head .r { text-align: right; }
.room {
  padding: 12px;
  border-bottom: 1px solid var(--line);
}
.room-name { font-weight: 700; font-size: 17px; color: var(--ink); line-height: 1.35; }
.room-name small { display: block; font-size: 14px; font-weight: 500; color: var(--muted); }
.segs { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.seg {
  display: grid;
  grid-template-columns: 52px minmax(92px, 1fr) 62px 96px;
  gap: 8px;
  align-items: baseline;
  padding: 2px 8px;
  margin: 0 -8px;
  border-radius: var(--radius-sm);
}
.seg .cls { font-weight: 700; }
.seg .seats { color: var(--muted); font-size: 15px; }
.seg .cnt { color: var(--muted); font-size: 15px; text-align: right; }
.seg .rng { font-weight: 600; text-align: right; }
.seg.match { background: var(--match-bg); }
.envelope { text-align: right; }
.envelope b { display: block; font-size: 20px; color: var(--heading); line-height: 1.3; }
.envelope span { font-size: 14px; color: var(--muted); }
.room.has-match { background: var(--tint); }

.source { font-size: 14px; color: var(--muted); margin: 0; }

/* Print documents */
.print {
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.print-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
}
.print-head h3 { font-size: 18px; line-height: 1.4; color: var(--heading); }
.spare { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.spare-label { font-size: 15px; font-weight: 600; color: var(--ink); }
.docs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.doc {
  background: var(--tint);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.doc h4 { margin: 0; font-size: 17px; line-height: 1.4; color: var(--ink); }
.doc p { margin: 0; font-size: 14px; color: var(--muted); }
.thumbs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
  min-height: 112px;
  align-items: flex-start;
}
.thumb {
  flex: 0 0 auto;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--paper);
  cursor: zoom-in;
  line-height: 0;
}
.thumb img { display: block; height: 104px; width: auto; border-radius: 3px; }
.thumb-wait { font-size: 14px; color: var(--muted); align-self: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-brand); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn:disabled { opacity: 0.6; cursor: progress; }
.print-status { margin: 0; font-size: 15px; color: var(--link); }
.print-status:empty { display: none; }

.viewer {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--scrim);
  display: flex;
  flex-direction: column;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  gap: 10px;
}
.viewer[hidden] { display: none; }
.viewer-bar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px 12px;
  color: var(--on-scrim);
  max-width: 1000px;
  width: 100%;
  margin: 0 auto;
}
.viewer-head { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.viewer-head b { font-size: 16px; line-height: 1.45; }
.viewer-hint { font-size: 14px; line-height: 1.5; opacity: 0.9; }
.viewer-actions { display: flex; flex: 0 0 auto; gap: 8px; }
.viewer-actions .btn { min-height: 40px; padding: 6px 16px; }
.print-sheets { display: none; }
@media print {
  @page { size: A4 portrait; margin: 0; }
  html.print-sheets-on, html.print-sheets-on body { margin: 0 !important; padding: 0 !important; background: #ffffff !important; }
  html.print-sheets-on body > *:not(.print-sheets) { display: none !important; }
  html.print-sheets-on .print-sheets { display: block !important; }
  .print-sheets img { display: block; width: 99.6%; height: auto; margin: 0 auto; }
  .print-sheets img + img { break-before: page; page-break-before: always; }
}
.viewer-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding-block: 4px 16px;
}
.sheet { margin: 0; width: min(100%, 640px); display: flex; flex-direction: column; gap: 6px; }
.sheet.land { width: min(100%, 1000px); }
.sheet img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 210 / 297;
  background: var(--paper);
  border-radius: 4px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
}
.sheet.land img { aspect-ratio: 297 / 210; }
.sheet figcaption { color: var(--on-scrim); font-size: 14px; text-align: center; opacity: 0.9; }
.doc-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.doc-actions .btn { flex: 1 1 150px; }

/* Phones and narrow windows */
@media (max-width: 900px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .finder { position: static; max-height: none; }
  .list { overflow: visible; }
}
@media (max-width: 640px) {
  .detail { padding: 18px 16px; }
  .detail h2 { font-size: 22px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat.wide { grid-column: 1 / -1; }
  .rooms-head { display: none; }

  function pad3(n) { return String(n).padStart(3, "0"); }
  function range(a, b) { return pad3(a) + "–" + pad3(b); }

  // หมายเลขเรียงต่อเนื่องในแต่ละวิชา ตามลำดับห้องสอบ 1–15 และเลขที่นักเรียน
  function build(s) {
    var segs = SEGMENTS.filter(function (seg) {
      if (s.classes === ALL) return true;
      var n = Number(seg.cls.split("/")[1]);
      return s.classes.indexOf(n) !== -1;
    });
    var cum = 0, rooms = [];
    segs.forEach(function (seg) {
      var start = cum + 1, end = cum + seg.count;
      cum = end;
      var last = rooms[rooms.length - 1];
      var row = { seg: seg, start: start, end: end };
      if (last && last.room === seg.room) {
        last.rows.push(row);
        last.end = end;
        last.total += seg.count;
      } else {
        rooms.push({ room: seg.room, roomNo: seg.roomNo, rows: [row], start: start, end: end, total: seg.count });
      }
    });
    s.rooms = rooms;
    s.total = cum;
    s.search = norm([s.code, s.name, G[s.group]].join(" "));
    return s;
  }

  function norm(t) {
    return String(t).toLowerCase().replace(/[\s.\-–_]/g, "");
  }

  // Parse a query that names a class ("6/10", "ม.6/10") or an exam room ("3507")
  function parseTarget(q) {
    var t = q.trim().replace(/\s+/g, "");
    var m = t.match(/^(?:ม\.?)?6\/(\d{1,2})$/);
    if (m) return { kind: "class", value: "6/" + Number(m[1]) };
    m = t.match(/^(3[56]\d\d)$/);
    if (m) return { kind: "room", value: m[1] };
    return null;
  }

  function segMatches(seg, target) {
    if (!target) return false;
    return target.kind === "class" ? seg.cls === target.value : seg.roomNo === target.value;
  }

  // ---------- state ----------
  var state = { q: "", day: -1, group: "", selected: "s1" };

    detail: document.getElementById("detail")
  };

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function filtered() {
    var target = parseTarget(state.q);
    var nq = norm(state.q);
    return SUBJECTS.filter(function (s) {
      if (state.day !== -1 && s.day !== state.day) return false;
      if (state.group && s.group !== state.group) return false;
      if (!nq) return true;
      if (target) {
        return s.rooms.some(function (r) {
          return r.rows.some(function (row) { return segMatches(row.seg, target); });
        });
      }
      return s.search.indexOf(nq) !== -1;
    });
  }

  // ---------- render: detail ----------
  function renderDetail() {

          }).map(esc).join(", ") + "</p>";

        "</div>";
    }).join("");

    el.detail.innerHTML =
      '<div class="detail-head"><div>' +
        '<p class="eyebrow"><span class="code">' + esc(s.code) + "</span> · " + esc(G[s.group]) + "</p>" +

      "</div>" +
      '<div class="actions"><button type="button" class="btn" id="copyBtn">คัดลอกหมายเลขวิชานี้</button>' +
      '<p class="copy-status" id="copyStatus" role="status"></p></div></div>' +
      '<div class="stats">' +
        '<div class="stat wide"><p class="stat-label">หมายเลขแบบทดสอบ</p><p class="stat-value big num">' + range(1, s.total) + "</p></div>" +

        '<div class="stat"><p class="stat-label">ห้องสอบ</p><p class="stat-value num">' + s.rooms.length + " <small>ห้อง</small></p></div>" +
        '<div class="stat wide"><p class="stat-label">ห้องเรียนที่สอบ</p><p class="stat-value text">' + esc(s.classLabel) + "</p></div>" +
      "</div>" +

        '<div class="rooms-head" aria-hidden="true"><span>ห้องสอบ</span><span>ห้องเรียน · เลขที่ · จำนวน · หมายเลขแบบทดสอบ</span><span class="r">ซองข้อสอบทั้งห้อง</span></div>' +
        rows +
      "</div>" +
      '<p class="source">ข้อมูลจากชีต “หมายเลขแบบทดสอบ” ในไฟล์ <a href="https://docs.google.com/spreadsheets/d/1xFDJVv1cTaBEND7d_FaKCj7JAh8Bo8oahPFi7uvorLI/edit?usp=sharing" target="_blank" rel="noopener">ห้องสอบ ม.6</a> ดึงข้อมูลเมื่อวันที่ 3 พ.ย. 2569 หมายเลขเรียงต่อเนื่องในแต่ละวิชา ตามลำดับห้องสอบ 1–15 และเลขที่นักเรียน</p>';

    document.getElementById("copyBtn").addEventListener("click", function () { copySubject(s); });

  // ---------- PDF: ใบปะหน้ากระเป๋าแบบทดสอบ และ ใบนำส่งกองกลาง ----------
  // Layout in millimetres, measured from the school's sample PDFs (A4).
  var DOC = {

    hubName: "กองกลางอาคาร 3",
    hubRoom: "169"
  };
  var PDF_FONT = 'Sarabun, "Leelawadee UI", Loma, Thonburi, "Noto Sans Thai", sans-serif';
  var PDF_K = 200 / 25.4;     // 200 dpi
  var THUMB_K = 1.1;
  var SLIP_ROWS = 8;
  var KINDS = {
    cover: { title: "ใบปะหน้ากระเป๋าแบบทดสอบ" },

  };
  var NO_DOWNLOAD = "หน้านี้ดาวน์โหลด PDF ไม่ได้ กด “ดูภาพสำหรับพิมพ์” แล้วบันทึกภาพไปพิมพ์แทน";
  var PRINT_IMG_K = 150 / 25.4;   // 150 dpi page images

  var fontsReady = (function () {

    ]).catch(function () {});

    garuda.onerror = resolve;
    garuda.src = GARUDA_SRC;
  });
  fontsReady = Promise.all([fontsReady, garudaReady]);

  function spacedRange(a, b) { return pad3(a) + " - " + pad3(b); }
  function timeText(t) { return t.replace("–", " - ") + " น."; }
  function minutesOf(t) {
    var m = t.match(/(\d{2})\.(\d{2})\D+(\d{2})\.(\d{2})/);
    return m ? (Number(m[3]) * 60 + Number(m[4])) - (Number(m[1]) * 60 + Number(m[2])) : 0;
  }

  // One bag per exam room in room order, then the spare bags.
  function bagsFor(s, spares) {
    var bags = s.rooms.map(function (r, i) {
      var classes = [];
      r.rows.forEach(function (row) { if (classes.indexOf(row.seg.cls) === -1) classes.push(row.seg.cls); });
      return {
        seq: i + 1, room: r.room, roomNo: r.roomNo, building: r.roomNo.charAt(0),
        classText: classes.map(function (c) { return "ม." + c; }).join(" , "),
        count: String(r.total), range: spacedRange(r.start, r.end)
      };
    });
    for (var i = 0; i < spares; i++) {
      bags.push({ seq: bags.length + 1, spare: true, roomNo: "สำรอง", building: "", classText: "ม.6", count: "", range: "" });
    }
    return bags;
  }

  // Delivery slips list up to 8 exam-room bags each; spare bags are counted on the last slip.
  function slipPages(s, spares) {
    var rooms = bagsFor(s, 0), pages = [];
    for (var i = 0; i < rooms.length; i += SLIP_ROWS) pages.push({ no: pages.length + 1, rooms: rooms.slice(i, i + SLIP_ROWS), spares: 0 });
    pages[pages.length - 1].spares = spares;
    return pages;
  }

  function pagesFor(s, kind, spares) {
    return kind === "cover"
      ? bagsFor(s, spares).map(function (b) { return { kind: "cover", bag: b }; })
      : slipPages(s, spares).map(function (p) { return { kind: "slip", slip: p }; });
  }

  function Painter(ctx, k) { this.ctx = ctx; this.k = k; this.ratio = {}; }
  Painter.prototype.font = function (w, px) { this.ctx.font = w + " " + px.toFixed(2) + "px " + PDF_FONT; };
  // font size (px) whose digit height is `mm`
  Painter.prototype.cap = function (w, mm) {
    if (!this.ratio[w]) {
      this.font(w, 100);
      this.ratio[w] = (this.ctx.measureText("1").actualBoundingBoxAscent || 70) / 100;
    }
    return mm * this.k / this.ratio[w];
  };
  // font size (px) whose Thai letter height (the body of น) is `mm`
  Painter.prototype.xh = function (w, mm) {
    var key = "x" + w;
    if (!this.ratio[key]) {
      this.font(w, 100);
      this.ratio[key] = (this.ctx.measureText("น").actualBoundingBoxAscent || 47) / 100;
    }
    return mm * this.k / this.ratio[key];
  };
  // font size (px) at which `text` is `mm` wide
  Painter.prototype.fit = function (w, text, mm) {
    this.font(w, 100);
    return mm * this.k * 100 / this.ctx.measureText(text).width;
  };
  Painter.prototype.text = function (str, x, y, w, px, align, maxW) {
    if (!str) return;
    var ctx = this.ctx;
    this.font(w, px);
    if (maxW) {
      var tw = ctx.measureText(str).width, mw = maxW * this.k;
      if (tw > mw) this.font(w, px * mw / tw);
    }
    ctx.textAlign = align || "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(str, x * this.k, y * this.k);
  };
  // Thai label centred on its x-height
  Painter.prototype.mid = function (str, x, cy, w, px, maxW) {
    this.font(w, px);
    var xh = this.ctx.measureText("ก").actualBoundingBoxAscent || px * 0.45;
    this.text(str, x, cy + xh / 2 / this.k, w, px, "center", maxW);
  };
  Painter.prototype.rect = function (x, y, w, h) {
    this.ctx.fillRect(x * this.k, y * this.k, w * this.k, h * this.k);
  };
  Painter.prototype.width = function (str, w, px) {
    this.font(w, px);

  // Justified Thai paragraph with bold runs. Lines break between words

      parts.forEach(function (t) { if (t) tokens.push({ t: t, b: r.b, sp: /^\s+$/.test(t) }); });
    });

      var prev = tokens[i - 1];
      var brk = !cur || tk.sp || prev.sp || (THAI.test(tk.t.charAt(0)) && THAI.test(prev.t.charAt(prev.t.length - 1)));
      if (brk) { cur = { tokens: [], sp: tk.sp, w: 0 }; groups.push(cur); }

      cur.w += tk.w;

      while (line.length && line[line.length - 1].sp) lw -= line.pop().w;

      line = []; lw = 0; maxW = o.right - o.x;

    groups.forEach(function (g) {
      if (g.sp && !line.length) return;
      if (!g.sp && line.length && lw + g.w > maxW) close(false);
      line.push(g);
      lw += g.w;
    });
    close(true);

      var x = li === 0 ? o.x1st : o.x, y = o.y + li * o.lh;

    canvas.height = Math.round((landscape ? 210 : 297) * k);
    var ctx = canvas.getContext("2d");
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#000000";
    if (turned) { ctx.translate(0, canvas.height); ctx.rotate(-Math.PI / 2); }

  function canvasJpeg(canvas) {

  }

  // Minimal PDF 1.4 writer: one full-page JPEG per A4 page.

    function put(x) { var b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); pos += b.length; }

    put(new Uint8Array([37, 80, 68, 70, 45, 49, 46, 52, 10, 37, 226, 227, 207, 211, 10]));
    begin(1); put("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
    begin(2); put("<< /Type /Pages /Count " + n + " /Kids [" + images.map(function (_, i) { return (4 + i * 3) + " 0 R"; }).join(" ") + "] >>\nendobj\n");
    var hex = "FEFF";
    for (var c = 0; c < title.length; c++) hex += ("000" + title.charCodeAt(c).toString(16)).slice(-4).toUpperCase();
    begin(3); put("<< /Title <" + hex + "> >>\nendobj\n");
    images.forEach(function (img, i) {
      var pg = 4 + i * 3, cs = "q " + W + " 0 0 " + H + " 0 0 cm /Im0 Do Q";
      begin(pg);
      put("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + W + " " + H + "] /Resources << /XObject << /Im0 " + (pg + 2) + " 0 R >> >> /Contents " + (pg + 1) + " 0 R >>\nendobj\n");
      begin(pg + 1);
      put("<< /Length " + cs.length + " >>\nstream\n" + cs + "\nendstream\nendobj\n");
      begin(pg + 2);
      put("<< /Type /XObject /Subtype /Image /Width " + img.w + " /Height " + img.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + img.bytes.length + " >>\nstream\n");
      put(img.bytes);

  function fileTitle(s, kind) { return KINDS[kind].title + " - " + s.code + " " + s.name; }

  // A printable document: how many pages, how to draw page i, and its names.
  function examDoc(s, kind, spares) {
    if (spares === undefined) spares = print.spares;
    var pages = pagesFor(s, kind, spares);
    return {
      key: s.id + "|" + kind + "|" + spares,
      title: KINDS[kind].title + " · " + s.code + " " + s.name,
      file: fileTitle(s, kind),
      count: pages.length,
      land: function (i) { return pages[i].kind === "cover"; },
      note: function (i) { return pageNote(pages[i]); },
      paint: function (canvas, k, i, forPdf) { paint(canvas, k, s, pages[i], forPdf); }
    };
  }

  function makePdfDoc(doc, onProgress) {
    var canvas = document.createElement("canvas"), out = [], i = 0;
    function next() {
      if (i >= doc.count) return buildPdf(out, doc.file);
      doc.paint(canvas, PDF_K, i, true);
      if (onProgress) onProgress(i + 1, doc.count);
      return canvasJpeg(canvas).then(function (bytes) {
        out.push({ bytes: bytes, w: canvas.width, h: canvas.height });
        i++;
        return new Promise(function (r) { setTimeout(r, 0); }).then(next);
      });
    }
    return fontsReady.then(next);
  }

  // Inside claude.ai the viewer hands files over through the downloads capability.
  // Opened as an ordinary web page, the browser's own download is used instead.
  var EMBEDDED = !!(window.claude && typeof window.claude.use === "function");
  var browserDownloads = {
    save: function (req) {
      var url = URL.createObjectURL(req.data);
      var a = document.createElement("a");
      a.href = url;
      a.download = req.filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      return Promise.resolve({ status: "saved" });
    }
  };
  var downloadsP = EMBEDDED
    ? window.claude.use("downloads").catch(function () { return null; })
    : Promise.resolve(browserDownloads);
  // The browser's print dialog only opens on an ordinary web page; claude.ai's frame refuses it.
  var CAN_PRINT = !EMBEDDED && typeof window.print === "function";
  var downloadsReady = null;
  downloadsP.then(function (dl) {
    downloadsReady = !!dl;
    if (!dl) {
      renderDetail();
      if (!document.getElementById("viewWp7").hidden) renderWpPanel();
    }
  });

  function downloadError(err) {

    if (code === "too_large") return "ไฟล์ใหญ่เกินกว่าที่บันทึกได้ในหน้านี้";

  function downloadPdf(doc, btn, say) {
    if (print.busy) return;

    var name = doc.file + ".pdf";
    downloadsP.then(function (dl) {
      if (!dl) throw { code: "unavailable" };

  // ---- student list: load from the sheet, paste, or a CSV file ----
  function normCls(v) { var m = String(v || "").match(/(\d+)\s*\/\s*0*(\d+)/); return m ? m[1] + "/" + Number(m[2]) : ""; }
  function cleanCell(v) { return String(v == null ? "" : v).replace(/\s+/g, " ").trim(); }
  function studentsFrom(header, rows) {
    var h = header.map(cleanCell);
    function col(names, fallback) { for (var i = 0; i < names.length; i++) { var j = h.indexOf(names[i]); if (j !== -1) return j; } return fallback; }
    var iNo = col(["เลขที่"], 0), iId = col(["เลขประจำตัว"], 1), iFirst = col(["ชื่อ"], 2), iLast = col(["สกุล", "นามสกุล"], 3);
    var iRoom = col(["ห้อง"], 6), iLv = col(["ระดับ1"], -1), iRm = col(["ห้อง1"], -1);
    var out = [], seen = {};
    rows.forEach(function (row) {
      var id = cleanCell(row[iId]).replace(/\.0+$/, ""), first = cleanCell(row[iFirst]), last = cleanCell(row[iLast]);
      var cls = normCls(row[iRoom]) || (iLv >= 0 && iRm >= 0 ? normCls(row[iLv] + "/" + row[iRm]) : "");
      var no = parseInt(cleanCell(row[iNo]), 10);
      if (!id || !first || !cls || seen[id]) return;
      seen[id] = true;
      out.push({ no: isNaN(no) ? 0 : no, id: id, first: first, last: last, cls: cls });
    });
    return out.sort(byClass);
  }
  function csvRow(line) {
    var out = [], cell = "", q = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line.charAt(i);
      if (q) { if (ch === '"') { if (line.charAt(i + 1) === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { out.push(cell); cell = ""; }
      else cell += ch;
    }
    out.push(cell);
    return out;
  }
  function parsePasted(text) {
    var lines = String(text || "").replace(/^﻿/, "").replace(/\r/g, "").split("\n").filter(function (l) { return l.trim(); });
    if (!lines.length) return [];
    var tab = lines[0].indexOf("\t") !== -1;
    var rows = lines.map(function (l) { return tab ? l.split("\t") : csvRow(l); });
    var hi = -1;
    rows.some(function (r, i) { if (r.some(function (c) { return cleanCell(c) === "เลขประจำตัว"; })) { hi = i; return true; } return false; });
    return studentsFrom(hi >= 0 ? rows[hi] : [], hi >= 0 ? rows.slice(hi + 1) : rows);
  }
  function rowsFromGviz(table) {
    var labels = (table.cols || []).map(function (c) { return c.label || ""; });
    var rows = (table.rows || []).map(function (r) {
      return (r.c || []).map(function (c) { return c ? (c.f != null ? c.f : (c.v == null ? "" : c.v)) : ""; });
    });
    if (!labels.some(function (l) { return cleanCell(l); }) && rows.length) labels = rows.shift();
    return studentsFrom(labels, rows);
  }
  function loadFromSheet() {
    return new Promise(function (resolve, reject) {

      function cleanup() { clearTimeout(timer); window[cb] = function () {}; s.remove(); }
      window[cb] = function (res) {
        cleanup();
        if (!res || res.status === "error" || !res.table) reject(new Error("sheet")); else resolve(res.table);
      };
      s.onerror = function () { cleanup(); reject(new Error("network")); };
      timer = setTimeout(function () { cleanup(); reject(new Error("timeout")); }, 12000);
      s.charset = "utf-8";
      s.src = (window.__WP7_SHEET_URL || WP7.sheetUrl) + cb;
      document.head.appendChild(s);
    });
  }

  // CSV files saved by Excel on Thai Windows are usually Windows-874 (TIS-620) or UTF-16, not UTF-8.
  function decodeText(buf) {
    var b = new Uint8Array(buf || new ArrayBuffer(0));
    try {
      if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder("utf-16le").decode(b.subarray(2));
      if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder("utf-16be").decode(b.subarray(2));
      return new TextDecoder("utf-8", { fatal: true }).decode(b);
    } catch (e) {
      try { return new TextDecoder("windows-874").decode(b); } catch (e2) { return new TextDecoder("utf-8").decode(b); }
    }
  }
  function garbled(list) {
    return list.some(function (st) { return /\uFFFD/.test(st.first + st.last); });
  }

  function usePasted(text) {
    var list = parsePasted(text);
    if (list.length && garbled(list)) {
      wp.msg = "อ่านภาษาไทยในไฟล์ไม่ได้ กรุณาเปิดชีต “รายชื่อนักเรียน” แล้วคัดลอกมาวางในกล่องแทน หรือดาวน์โหลดจาก Google Sheets เป็น CSV แล้วเลือกไฟล์นั้น";

      return;
    }
    if (!list.length) {
      wp.msg = "อ่านรายชื่อไม่ได้ กรุณาคัดลอกทั้งชีตรวมแถวหัวตาราง (เลขที่ เลขประจำตัว ชื่อ สกุล ... ห้อง) แล้ววางอีกครั้ง";

    renderWp7();
  }

  wpEl.view.addEventListener("click", function (e) {
    var t = e.target.closest("[data-wp-day], [data-wp-cls], [data-wp-sub], [data-wp-remove], [data-wp-load], [data-wp-paste], [data-wp-cancel], [data-wp-use], [data-wp-clear], [data-wp-images], [data-wp-pdf]");
    if (!t) return;
    if (!t.hasAttribute("data-wp-clear")) wp.confirmClear = false;
    if (t.hasAttribute("data-wp-day")) { wp.day = Number(t.getAttribute("data-wp-day")); renderWpChips(); renderWpList(); }
    else if (t.hasAttribute("data-wp-cls")) { wp.cls = t.getAttribute("data-wp-cls"); wp.q = ""; wpEl.q.value = ""; renderWpChips(); renderWpList(); }
    else if (t.hasAttribute("data-wp-sub")) {
      var parts = t.getAttribute("data-wp-sub").split("|"), a = wp.absent[parts[0]];
      if (!a || !a.days[parts[1]]) return;
      var list = a.days[parts[1]], at = list.indexOf(parts[2]);
      if (at === -1) list.push(parts[2]); else list.splice(at, 1);
      saveAbsent();
      renderWpPanel();
    } else if (t.hasAttribute("data-wp-remove")) {
      delete wp.absent[t.getAttribute("data-wp-remove")];
      saveAbsent();
      renderWpList();
      renderWpPanel();
    } else if (t.hasAttribute("data-wp-load")) loadSheet();
    else if (t.hasAttribute("data-wp-paste")) {
      wp.pasting = true; wp.msg = "";
      renderWpSource();
      var ta = document.getElementById("wpPaste");
      if (ta) ta.focus();
    } else if (t.hasAttribute("data-wp-cancel")) { wp.pasting = false; wp.msg = ""; renderWpSource(); }
    else if (t.hasAttribute("data-wp-use")) usePasted((document.getElementById("wpPaste") || {}).value);
    else if (t.hasAttribute("data-wp-clear")) {
      if (!wp.confirmClear) { wp.confirmClear = true; renderWpSource(); return; }
      wp.confirmClear = false;
      wp.students = []; wp.absent = {}; wp.loadedAt = ""; wp.msg = "ล้างรายชื่อออกจากเบราว์เซอร์นี้แล้ว";
      writeStore("wp7Students", null);
      writeStore("wp7Absent", null);
      renderWp7();
    } else {
      var items = wp7Items();
      if (!items.length) { sayWp("ยังไม่มีหน้าที่จะพิมพ์ กรุณาเลือกรายวิชาอย่างน้อย 1 วิชา"); return; }

  wpEl.view.addEventListener("change", function (e) {

      setAbsent(st, wp.day, t.checked);

      renderWpPanel();
    } else if ((id = t.getAttribute("data-wp-memo")) && wp.absent[id]) { wp.absent[id].memo = t.checked; saveAbsent(); }
    else if ((id = t.getAttribute("data-wp-cert")) && wp.absent[id]) { wp.absent[id].cert = t.checked; saveAbsent(); }
    else if (t.id === "wpDate") { wp.memoDate = t.value || isoToday(); }
    else if (t.id === "wpFile" && t.files && t.files[0]) {

      fr.readAsArrayBuffer(t.files[0]);

  var tabNumbers = document.getElementById("tabNumbers"), tabWp7 = document.getElementById("tabWp7");

  function route() {
    var h = location.hash.slice(1), onWp = h === "wp7";
    viewNumbers.hidden = onWp;

    tabNumbers.href = "#" + state.selected;

    else {
      tabNumbers.setAttribute("aria-current", "page");
      tabWp7.removeAttribute("aria-current");
      if (h && h !== state.selected && SUBJECTS.some(function (s) { return s.id === h; })) select(h, false);
    }
  }

  // ---------- events ----------
  function select(id, scroll) {
    if (!SUBJECTS.some(function (s) { return s.id === id; })) return;
    state.selected = id;
    if (location.hash !== "#" + id) {
      try { history.replaceState(null, "", "#" + id); } catch (e) { location.hash = id; }
    }
    tabNumbers.href = "#" + id;
    renderList();
    renderDetail();
    if (scroll && window.matchMedia("(max-width: 900px)").matches) {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      el.detail.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    }
  }

  function onFilterChange() {
    el.clear.hidden = !state.q;
    var items = filtered();
    if (items.length === 1 && items[0].id !== state.selected) {
      state.selected = items[0].id;
      try { history.replaceState(null, "", "#" + state.selected); } catch (e) {}
    }
    renderList();
    renderDetail();
  }

  el.q.addEventListener("input", function () {
    state.q = el.q.value;
    onFilterChange();
  });
  el.q.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      var items = filtered();
      if (items.length) select(items[0].id, true);
    } else if (e.key === "Escape" && el.q.value) {
      el.q.value = "";
      state.q = "";
      onFilterChange();
    }
  });
  el.clear.addEventListener("click", function () {
    el.q.value = "";
    state.q = "";
    onFilterChange();
    el.q.focus();
  });
  el.days.addEventListener("click", function (e) {
    var b = e.target.closest("[data-day]");
    if (!b) return;
    state.day = Number(b.getAttribute("data-day"));
    renderDayChips();
    onFilterChange();
  });
  el.group.addEventListener("change", function () {
    state.group = el.group.value;
    onFilterChange();
  });
  el.list.addEventListener("click", function (e) {
    var b = e.target.closest("[data-id]");
    if (b) select(b.getAttribute("data-id"), true);
  });
  el.detail.addEventListener("click", function (e) {
    var t = e.target.closest("[data-pdf], [data-spares], [data-thumb], [data-images]");
    if (!t) return;
    var s = currentSubject();
    if (t.hasAttribute("data-spares")) {
      print.spares = Number(t.getAttribute("data-spares"));
      try { localStorage.setItem("examSpareBags", String(print.spares)); } catch (err) {}
      renderDetail();
      var again = el.detail.querySelector('[data-spares="' + print.spares + '"]');
      if (again) again.focus();
    } else if (t.hasAttribute("data-pdf")) {
      downloadPdf(examDoc(s, t.getAttribute("data-pdf")), t, setPrintStatus);
    } else if (t.hasAttribute("data-images")) {
      showImages(examDoc(s, t.getAttribute("data-images")), 0);
    } else {
      showImages(examDoc(s, t.getAttribute("data-thumb")), Number(t.getAttribute("data-page")));
    }
  });
  window.addEventListener("hashchange", route);

  // ---------- start ----------
  var initial = location.hash.slice(1);
  if (SUBJECTS.some(function (s) { return s.id === initial; })) state.selected = initial;
  renderDayChips();
  renderGroupSelect();
  renderList();
  renderDetail();
  route();

  window.__EXAM_DATA__ = {
    SUBJECTS: SUBJECTS, subjectText: subjectText, makePdf: makePdf, pagesFor: pagesFor, paint: paint,
    wp7: { parsePasted: parsePasted, rowsFromGviz: rowsFromGviz, wp7Items: wp7Items, wp7Doc: wp7Doc, makePdfDoc: makePdfDoc, state: wp }
  };
})();
</script>

</body>
</html>
